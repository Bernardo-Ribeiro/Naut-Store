    ::-webkit-scrollbar-track {

    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(
        180deg,
        #2db8d1,
        #748cab

      border-radius: 999px;
      border: 2px solid #0d1321;
    }

    ::-webkit-scrollbar-thumb:hover {
      box-shadow:
        0 0 10px rgba(77, 217, 230, 0.5),
        0 0 20px rgba(77, 217, 230, 0.3);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
    }

    body, p {
      font-family: 'Inter', sans-serif;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -1;
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #2db8d1, #4dd9e6, #2db8d1);
      z-index: 100;
      will-change: width;
    }

    .glow-text {
      background: linear-gradient(135deg, #748cab, #f0ebd8, #748cab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow-flicker 3s infinite;
    }

    @keyframes glow-flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .float-animation {
      animation: float-smooth 6s ease-in-out infinite;
    }

    @keyframes float-smooth {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .reveal-text {
      opacity: 0;
      animation: reveal-in 0.8s ease-out forwards;
    }

    @keyframes reveal-in {
      0% { 
        opacity: 0;
        transform: translateY(30px);
      }
      100% { 
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-hover {
      transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
      position: relative;
    }

    .card-hover:hover {
      transform: translateY(-15px);
    }

    .card-hover::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #748cab, transparent);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .card-hover:hover::before {
      opacity: 1;
    }

    .tech-grid {
      display: grid;
      gap: 1px;
      background: linear-gradient(135deg, rgba(116, 140, 171, 0.2), rgba(248, 235, 216, 0.1));
      padding: 1px;
      border-radius: 1.5rem;

      border-radius: calc(1.5rem - 2px);
    }

    .section-divider {

      background: linear-gradient(90deg, transparent, #748cab, transparent);
      margin: 0rem 0;

      position: fixed;

      height: 300px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
      background: radial-gradient(circle, rgba(77, 217, 230, 0.5) 0%, transparent 70%);
      border-radius: 50%;

      filter: blur(40px);

    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

<body class="bg-[#0a1929] text-[#f0ebd8] font-sans overflow-x-hidden">
  <div class="cursor-glow" id="cursor-glow"></div>
  <div class="scroll-progress" id="scroll-progress"></div>
  <div id="canvas-container"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>

  <script>
    // THREE.JS SHADER BACKGROUND
    let scene, camera, renderer, mesh, uniforms;
    let mouseX = 0, mouseY = 0;
    let scrollProgress = 0;

    function initThreeJS() {
      // Scene setup
      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(
        -1, 1,
        1, -1,
        0, 1
      );
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x051a3d, 1);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Vertex Shader
      const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;

      // Fragment Shader - Underwater Water Effect (Naut)
      const fragmentShader = `
      uniform float time;
      uniform vec2 mouse;
      uniform vec2 resolution;
      uniform float scrollProgress;

      varying vec2 vUv;

      float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);

          f = f * f * (3.0 - 2.0 * f);

          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));

          return mix(
              mix(a, b, f.x),
              mix(c, d, f.x),
              f.y
          );
      }

      float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;

          for(int i = 0; i < 5; i++) {
              v += noise(p) * a;
              p *= 2.0;
              a *= 0.5;
          }

          return v;
      }

      void main() {

          vec2 uv = vUv;

          // Aspect correction
          vec2 aspect = vec2(resolution.x / resolution.y, 1.0);

          // Deep flow movement
          vec2 p = uv * 2.5;

          p.x += sin(time * 0.08 + p.y * 1.5) * 0.08;
          p.y += cos(time * 0.06 + p.x * 1.2) * 0.08;

          float n1 = fbm(p + time * 0.03);
          float n2 = fbm(p * 1.8 - time * 0.02);

          float pattern = mix(n1, n2, 0.5);

          vec3 deep = vec3(0.015, 0.03, 0.07);
          vec3 mid  = vec3(0.03, 0.09, 0.18);
          vec3 soft = vec3(0.08, 0.22, 0.38);

          vec3 col = mix(deep, mid, pattern);
          col = mix(col, soft, smoothstep(0.45, 0.9, pattern) * 0.35);

          float vignette = 1.0 - length(uv - 0.5) * 0.9;
          col *= vignette;

          vec2 m = (uv - mouse) * aspect;

          float dist = length(m);

          float glow =
              exp(-dist * 60.0) * 0.2;

          float core =
              exp(-dist * 100.0);

          float ripple =
              sin(dist * 20.0 - time * 2.5) *
              exp(-dist * 10.0);

          vec3 mouseColor =
              vec3(0.25, 0.65, 1.0) * glow +
              vec3(0.6, 0.85, 1.0) * core +
              vec3(0.15, 0.35, 0.8) * ripple * 0.15;

          col += mouseColor;

          col += sin(time + uv.y * 8.0) * 0.02;

          col = pow(col, vec3(1.2));

          gl_FragColor = vec4(col, 1.0);
      }
      `;

      uniforms = {
        time: { value: 0.0 },
        mouse: { value: new THREE.Vector2(0.5, 0.5) },
        scrollProgress: { value: 0.0 },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        transparent: false,
        depthWrite: false
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Mouse tracking
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX / window.innerWidth;
        mouseY = 1.0 - (e.clientY / window.innerHeight);
        uniforms.mouse.value.set(mouseX, mouseY);
      });

      // Scroll tracking
      window.addEventListener('scroll', () => {
        scrollProgress = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
        uniforms.scrollProgress.value = scrollProgress;
      });

      // Window resize
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);

        uniforms.resolution.value.set(
          window.innerWidth,
          window.innerHeight
        );
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      uniforms.time.value += 0.016;
      renderer.render(scene, camera);
    }

    // Cursor glow tracking
    function initCursorGlow() {
      const glow = document.getElementById('cursor-glow');
      document.addEventListener('mousemove', (e) => {
        glow.style.transform = `translate(${e.clientX - 150}px, ${e.clientY - 150}px)`;
      });
    }

    // Scroll progress bar
    function initScrollProgress() {
      const progressBar = document.getElementById('scroll-progress');
      window.addEventListener('scroll', () => {
        const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
        progressBar.style.width = scrolled + '%';
      });
    }

    // Intersection Observer for scroll animations
    function initScrollAnimations() {
      const elements = document.querySelectorAll('[data-reveal]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationDelay = entry.target.dataset.delay || '0s';
            entry.target.classList.add('reveal-text');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      elements.forEach(el => observer.observe(el));
    }

    window.addEventListener('load', () => {
      initThreeJS();
      initCursorGlow();
      initScrollProgress();
      setTimeout(initScrollAnimations, 100);
    });
  </script>
