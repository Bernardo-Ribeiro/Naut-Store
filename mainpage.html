    * {

    #canvas-container {

      height: 100vh;
      z-index: -1;
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;

      background: linear-gradient(90deg, #2db8d1, #4dd9e6, #2db8d1);
      z-index: 100;
      will-change: width;

      background: linear-gradient(135deg, #748cab, #f0ebd8, #748cab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

    }

    .float-animation {
      animation: float-smooth 6s ease-in-out infinite;
    }

    @keyframes float-smooth {

      50% { transform: translateY(-20px); }
    }

    .reveal-text {

    }

    @keyframes reveal-in {

        transform: translateY(30px);

      top: -1px;

      right: 0;

  <div class="cursor-glow" id="cursor-glow"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <script>
    // THREE.JS SHADER BACKGROUND
    let scene, camera, renderer, mesh, uniforms;
    let mouseX = 0, mouseY = 0;
    let scrollProgress = 0;

    function initThreeJS() {
      // Scene setup
      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(
        -1, 1,
        1, -1,
        0, 1
      );
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x051a3d, 1);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Vertex Shader
      const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;

      // Fragment Shader - Efeito de Água Submersa (Naut)
      const fragmentShader = `
uniform float time;
uniform vec2 mouse;
uniform vec2 resolution;
uniform float scrollProgress;

varying vec2 vUv;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);

    f = f * f * (3.0 - 2.0 * f);

    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));

    return mix(
        mix(a, b, f.x),
        mix(c, d, f.x),
        f.y
    );
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;

    for(int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p *= 2.0;
        a *= 0.5;
    }

    return v;
}

void main() {

    vec2 uv = vUv;

    // Aspect correction
    vec2 aspect = vec2(resolution.x / resolution.y, 1.0);

    // Deep flow movement
    vec2 p = uv * 2.5;

    p.x += sin(time * 0.08 + p.y * 1.5) * 0.08;
    p.y += cos(time * 0.06 + p.x * 1.2) * 0.08;

    // Layered soft noise
    float n1 = fbm(p + time * 0.03);
    float n2 = fbm(p * 1.8 - time * 0.02);

    float pattern = mix(n1, n2, 0.5);

    // Dark navy palette
    vec3 deep = vec3(0.015, 0.03, 0.07);
    vec3 mid  = vec3(0.03, 0.09, 0.18);
    vec3 soft = vec3(0.08, 0.22, 0.38);

    vec3 col = mix(deep, mid, pattern);
    col = mix(col, soft, smoothstep(0.45, 0.9, pattern) * 0.35);

    // Subtle vignette
    float vignette = 1.0 - length(uv - 0.5) * 0.9;
    col *= vignette;

    // Mouse highlight
    vec2 m = (uv - mouse) * aspect;

    float dist = length(m);

    // Soft bloom ring
    float glow =
        exp(-dist * 8.0) * 0.6;

    // Inner bright core
    float core =
        exp(-dist * 28.0);

    // Elegant ripple
    float ripple =
        sin(dist * 40.0 - time * 2.5) *
        exp(-dist * 10.0);

    vec3 mouseColor =
        vec3(0.25, 0.65, 1.0) * glow +
        vec3(0.6, 0.85, 1.0) * core +
        vec3(0.15, 0.35, 0.8) * ripple * 0.25;

    col += mouseColor;

    // Tiny animated shimmer
    col += sin(time + uv.y * 8.0) * 0.008;

    // Contrast curve
    col = pow(col, vec3(1.15));

    gl_FragColor = vec4(col, 1.0);
}
      `;

      uniforms = {
        time: { value: 0.0 },
        mouse: { value: new THREE.Vector2(0.5, 0.5) },
        scrollProgress: { value: 0.0 },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        transparent: false,
        depthWrite: false
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Mouse tracking
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX / window.innerWidth;
        mouseY = 1.0 - (e.clientY / window.innerHeight);
        uniforms.mouse.value.set(mouseX, mouseY);
      });

      // Scroll tracking
      window.addEventListener('scroll', () => {
        scrollProgress = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
        uniforms.scrollProgress.value = scrollProgress;
      });

      // Window resize
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);

        uniforms.resolution.value.set(
          window.innerWidth,
          window.innerHeight
        );
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      uniforms.time.value += 0.016;
      renderer.render(scene, camera);
    }

    // Cursor glow tracking
    function initCursorGlow() {
      const glow = document.getElementById('cursor-glow');
      document.addEventListener('mousemove', (e) => {
        glow.style.transform = `translate(${e.clientX - 150}px, ${e.clientY - 150}px)`;
      });
    }

    // Scroll progress bar
    function initScrollProgress() {
      const progressBar = document.getElementById('scroll-progress');
      window.addEventListener('scroll', () => {
        const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
        progressBar.style.width = scrolled + '%';
      });
    }

    // Intersection Observer para animações com scroll
    function initScrollAnimations() {
      const elements = document.querySelectorAll('[data-reveal]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationDelay = entry.target.dataset.delay || '0s';
            entry.target.classList.add('reveal-text');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      elements.forEach(el => observer.observe(el));
    }

    window.addEventListener('load', () => {
      initThreeJS();
      initCursorGlow();
      initScrollProgress();
      setTimeout(initScrollAnimations, 100);
    });
  </script>
