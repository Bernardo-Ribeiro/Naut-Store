<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naut Store | Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="frame">
    <div data-include="header"></div>

    <main class="main">
      <aside class="sidebar">
        <div class="searchbox">
          <input type="text" id="searchInput" placeholder="Search..." />
        </div>
        <nav class="categories">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="free">Free</button>
          <button class="category-btn" data-category="shaders">Shaders</button>
          <button class="category-btn" data-category="logic">Logic</button>
          <button class="category-btn" data-category="models">Models</button>
        </nav>
      </aside>

      <section class="content">
        <h2 class="content-title">Featured Products</h2>
        <div id="product-list" class="grid"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/include-header.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
